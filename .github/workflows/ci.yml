name: Node.js CI Pipeline

# Trigger CI agar berjalan setiap kali ada push ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Mengambil kode dari repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Menyiapkan environment Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    # Menginstal dependencies (Jest)
    - name: Install dependencies
      run: npm install

    # Menjalankan unit test
    - name: Run tests
      run: npm test